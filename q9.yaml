###will be used as webapp-hpa.yaml 
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webapp-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kkapp-deploy
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource 
      resource: 
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behaviour:
    scaleDown:
      stablizationWindowSeconds: 300
