apiVersion: apps/v1
kind: Deployment
metadata:
  name: logging-deployment
  namespace: logging-ns
spec:
  replicas: 3
  selector:
    matchLabels:
      app: logger 
  template:
    metadata:
      labels:
        app: logger
    spec:
      volumes:
      - name: log-volume
        emptyDir: {}
      containers:
      - name: app-container 
        image: busybox
        volumeMounts: 
          - name: log-volume
            mountPath: /var/log/app
        command:
          - sh
          - -c
          - "while true; do echo 'Log entry' >> /var/log/app/app.log; sleep 5; done"
      - name: log-agent
        image: busybox
        volumeMounts:
          - name: log-volume
            mountPath: /var/log/app
        command:
          - tail
          - -f
          - /var/log/app/app.log
